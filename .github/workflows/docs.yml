name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # mkdocstrings reads the package statically via griffe, so mujoco and the
      # package itself are not needed here.
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      # The viewer ships decimated copies of the package meshes. Fail here rather
      # than publish a viewer built from meshes the package no longer has.
      - name: Check the web meshes against the package
        run: python web/tools/check_mesh_drift.py
      - name: Build the browser viewer
        working-directory: web
        run: |
          npm ci
          npm run build
      # docs/sim is gitignored: mkdocs copies whatever is under docs/ verbatim,
      # so the bundle is placed here rather than committed.
      - name: Stage the viewer into the docs site
        run: |
          rm -rf docs/sim
          cp -R web/dist docs/sim
      - name: Build
        run: mkdocs build --strict
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: mkdocs gh-deploy --force
